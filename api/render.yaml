# Render Blueprint - lightweight 24/7 celebrity slot monitor only.
# The main frontend and API remain hosted on Vercel.
services:
  - type: web
    name: huy-locket-slot-worker
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: node slot-worker.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_WEB_URL
        value: https://duchi.vercel.app
      # Must match the Vercel backend values so stored sessions can be read.
      - key: DATABASE_URL
        sync: false
      - key: SLOT_MONITOR_ENCRYPTION_KEY
        sync: false
      # Optional notification channels. Add only when already configured.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
