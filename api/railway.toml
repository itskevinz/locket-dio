# Khi Root Directory = api trên Railway
[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"
  # The API lives in an isolated monorepo directory. Frontend-only commits must
  # not restart the API and erase short-lived upstream credentials from memory.
  watchPatterns = ["/api/**"]

[deploy]
  healthcheckPath = "/health"
  healthcheckTimeout = 100
  restartPolicyType = "ON_FAILURE"
