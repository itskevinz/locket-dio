          page = replace_once(page, old_role_call, new_role_call, "role undo event")

          modal_target = '''              Bạn đang thực hiện thao tác <strong className="uppercase text-primary font-bold">{actionModal.type}</strong> đối với tài khoản <strong>{userName(actionModal.user)}</strong>. Hành động này sẽ được ghi nhận vào nhật ký Audit Log vĩnh viễn.'''
          modal_target_new = '''              Bạn đang thực hiện thao tác <strong className="uppercase text-primary font-bold">{actionModal.type}</strong> đối với tài khoản <strong>{userName(actionModal.user)}</strong> — <strong>{actionModal.user?.email || "không có email"}</strong> — UID: <strong>{actionModal.user?.uid}</strong>. Hành động này sẽ được ghi nhận vào nhật ký Audit Log vĩnh viễn.'''
          page = replace_once(page, modal_target, modal_target_new, "modal safety target")

