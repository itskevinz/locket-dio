name: Apply general admin apology email sender

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-admin-general-apology-email.yml"

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply source patch
        run: node scripts/apply-admin-general-apology-email.cjs

      - name: Check backend syntax
        run: node --check api/src/routes/adminRoutes.js

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend production build
        run: npx vite build

      - name: Commit final feature
        run: |
          rm -rf dist
          git rm -f .github/workflows/apply-admin-general-apology-email.yml scripts/apply-admin-general-apology-email.cjs
          git add api/src/routes/adminRoutes.js src/pages/Public/AdminUsers/index.jsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add general admin apology email sender"
          git push origin HEAD:main
