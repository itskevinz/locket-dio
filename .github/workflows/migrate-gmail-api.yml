name: Migrate mail transport to Gmail API

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-gmail-api.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Apps Script mail call sites to Gmail API
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f"Patch anchor not found: {label}")
              return text.replace(old, new, 1)

          # --------------------------------------------------------------
          # Admin mail templates: preserve rendering, switch only transport.
          # --------------------------------------------------------------
          path = Path("api/src/services/adminApologyMailer.js")
          text = path.read_text()
          if 'require("./gmailApiMailer")' not in text:
              text = 'const { sendGmailMessage } = require("./gmailApiMailer");\n' + text

          start = text.index("async function sendAdminApologyEmail(")
          end = text.index("\nmodule.exports = {", start)
          new_function = r'''async function sendAdminApologyEmail({
  email,
  displayName = "",
  uid = "",
  idempotencyKey = "",
  template = "apology",
  customMessage = "",
} = {}) {
  const fromName = clean(process.env.GMAIL_FROM_NAME, 120) || EMAIL_BRAND;
  const target = clean(email, 320).toLowerCase();
  if (!target || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(target)) {
    const error = new Error("Tài khoản không có địa chỉ email hợp lệ để gửi thư.");
    error.code = "EMAIL_ADDRESS_INVALID";
    error.status = 400;
    throw error;
  }

  const message = buildAdminApologyEmail({
    email: target,
    displayName,
    uid,
    template,
    customMessage,
  });

  try {
    const result = await sendGmailMessage({
      to: target,
      subject: message.subject,
      text: message.text,
      html: message.html,
      fromName,
      idempotencyKey: clean(idempotencyKey, 240),
    });
    return {
      ...result,
      template: message.template,
      label: message.label,
    };
  } catch (cause) {
    if (/^(EMAIL_|GMAIL_|GOOGLE_)/.test(String(cause?.code || ""))) throw cause;
    const error = new Error("Gmail API gửi thư thất bại.");
    error.code = "EMAIL_SEND_FAILED";
    error.status = Number(cause?.status) || 502;
    error.cause = cause;
    throw error;
  }
}
'''
          text = text[:start] + new_function + text[end:]
          path.write_text(text)

          # --------------------------------------------------------------
          # Admin PIN recovery: keep OTP email HTML; use Gmail API transport.
          # --------------------------------------------------------------
          path = Path("api/src/routes/adminPinRecoveryRoutes.js")
          text = path.read_text()
          import_anchor = 'const { getRequestContext } = require("../services/userActivityContext");\n'
          if 'require("../services/gmailApiMailer")' not in text:
              text = replace_once(
                  text,
                  import_anchor,
                  import_anchor + 'const { sendGmailMessage } = require("../services/gmailApiMailer");\n',
                  "PIN Gmail import",
              )

          old_head = '''async function sendRecoveryEmail({ email, otp, idempotencyKey }) {
  const endpoint = clean(process.env.GMAIL_APPS_SCRIPT_URL, 1000);
  const secret = clean(process.env.GMAIL_APPS_SCRIPT_SECRET, 500);
  const fromName = clean(process.env.GMAIL_FROM_NAME, 120) || "Duchi Locket";

  if (!endpoint || !secret) {
    const error = new Error("Gmail chưa được cấu hình trên hệ thống.");
    error.code = "EMAIL_NOT_CONFIGURED";
    error.status = 503;
    throw error;
  }
  if (!/^https:\/\//i.test(endpoint)) {
    const error = new Error("URL Google Apps Script không hợp lệ.");
    error.code = "EMAIL_RELAY_URL_INVALID";
    error.status = 500;
    throw error;
  }

'''
          new_head = '''async function sendRecoveryEmail({ email, otp, idempotencyKey }) {
  const fromName = clean(process.env.GMAIL_FROM_NAME, 120) || "Duchi Locket";

'''
          text = replace_once(text, old_head, new_head, "PIN relay config")

          fetch_start = text.index("  const response = await fetch(endpoint, {", text.index("async function sendRecoveryEmail"))
          load_start = text.index("\nasync function loadOtpRecovery", fetch_start)
          new_tail = r'''  return sendGmailMessage({
    to: email,
    subject,
    text,
    html,
    fromName,
    idempotencyKey: clean(idempotencyKey, 240),
  });
}
'''
          text = text[:fetch_start] + new_tail + text[load_start:]
          path.write_text(text)

          # --------------------------------------------------------------
          # Slot Monitor Gmail notifications.
          # --------------------------------------------------------------
          path = Path("api/src/modules/slotMonitor/notifiers.js")
          text = path.read_text()
          if 'require("../../services/gmailApiMailer")' not in text:
              text = 'const { sendGmailMessage } = require("../../services/gmailApiMailer");\n' + text

          old_provider = '''    email: {
      configured: Boolean(
        clean(process.env.GMAIL_APPS_SCRIPT_URL, 1000) &&
          clean(process.env.GMAIL_APPS_SCRIPT_SECRET, 500),
      ),
    },'''
          new_provider = '''    email: {
      configured: Boolean(clean(process.env.DATABASE_URL || process.env.NEON_DATABASE_URL, 2000)),
      provider: "gmail-api",
      requiresOauth: true,
    },'''
          text = replace_once(text, old_provider, new_provider, "slot Gmail provider")

          start = text.index("async function sendEmail(")
          end = text.index("\nasync function sendZalo", start)
          new_send = r'''async function sendEmail(email, payload, { idempotencyKey = "" } = {}) {
  const fromName = clean(process.env.GMAIL_FROM_NAME, 120) || EMAIL_BRAND;
  const target = clean(email, 320).toLowerCase();
  if (!target) {
    const error = new Error("Chưa có địa chỉ Gmail/Email.");
    error.code = "EMAIL_ADDRESS_REQUIRED";
    throw error;
  }

  const message = buildSlotMessage(payload);
  const subject = buildEmailSubject(payload, message);
  const text = buildEmailText(payload, message);
  const html = buildEmailHtml(payload, message);
  try {
    return await sendGmailMessage({
      to: target,
      subject,
      text,
      html,
      fromName,
      idempotencyKey: clean(idempotencyKey, 240),
    });
  } catch (cause) {
    if (/^(EMAIL_|GMAIL_|GOOGLE_)/.test(String(cause?.code || ""))) {
      cause.status = Number(cause.status) || 502;
      throw cause;
    }
    const error = new Error("Gmail API gửi thông báo thất bại.");
    error.code = "EMAIL_SEND_FAILED";
    error.status = 502;
    error.cause = cause;
    throw error;
  }
}
'''
          text = text[:start] + new_send + text[end:]
          path.write_text(text)

          # --------------------------------------------------------------
          # Admin Email Center: connect button + honest safe-counter labels.
          # --------------------------------------------------------------
          path = Path("src/pages/Public/AdminEmailCenter.jsx")
          text = path.read_text()

          text = replace_once(
              text,
              '  const [quotaLoading, setQuotaLoading] = useState(false);\n  const [quotaError, setQuotaError] = useState("");',
              '  const [quotaLoading, setQuotaLoading] = useState(false);\n  const [quotaError, setQuotaError] = useState("");\n  const [connectingGmail, setConnectingGmail] = useState(false);',
              "Gmail connecting state",
          )

          refresh_anchor = '''  const refreshAll = useCallback(async () => {
    await Promise.allSettled([loadQuota(), loadHistory(), loadTemplates()]);
  }, [loadHistory, loadQuota, loadTemplates]);
'''
          connect_block = refresh_anchor + r'''
  const connectGmail = useCallback(async () => {
    setConnectingGmail(true);
    try {
      const result = await adminRequest("/gmail-oauth-start");
      if (!result?.url) throw new Error("Google OAuth không trả URL kết nối.");
      window.location.assign(result.url);
    } catch (error) {
      setConnectingGmail(false);
      if (!handleAuthFailure(error)) {
        SonnerWarning("Không mở được Google", error?.message || "Không bắt đầu được Gmail OAuth.");
      }
    }
  }, [handleAuthFailure]);
'''
          text = replace_once(text, refresh_anchor, connect_block, "connect Gmail callback")

          authorized_effect = '''  useEffect(() => {
    if (!authorized) return;
    refreshAll();
  }, [authorized, refreshAll]);
'''
          oauth_effect = authorized_effect + r'''
  useEffect(() => {
    if (!authorized || typeof window === "undefined") return;
    const params = new URLSearchParams(window.location.search);
    const gmail = params.get("gmail");
    if (!gmail) return;
    if (gmail === "connected") {
      SonnerSuccess("Gmail API đã kết nối", "Hệ thống đã lưu OAuth an toàn và sẵn sàng gửi thư.");
      refreshAll();
    } else if (gmail === "error") {
      SonnerWarning("Kết nối Gmail thất bại", "Hãy thử kết nối Gmail lại.");
    }
    params.delete("gmail");
    const nextQuery = params.toString();
    window.history.replaceState({}, "", `${window.location.pathname}${nextQuery ? `?${nextQuery}` : ""}${window.location.hash}`);
  }, [authorized, refreshAll]);
'''
          text = replace_once(text, authorized_effect, oauth_effect, "OAuth return effect")

          old_percent = '''  const quotaPercent = useMemo(() => {
    const remaining = Number(quota?.remaining);
    const total = Number(quota?.dailyLimit);
    if (!Number.isFinite(remaining) || !Number.isFinite(total) || total <= 0) return null;
    return Math.max(0, Math.min(100, (remaining / total) * 100));
  }, [quota]);'''
          new_percent = '''  const quotaPercent = useMemo(() => {
    const sentToday = Number(quota?.sentToday);
    const total = Number(quota?.dailyLimit);
    if (!Number.isFinite(sentToday) || !Number.isFinite(total) || total <= 0) return null;
    return Math.max(0, Math.min(100, (sentToday / total) * 100));
  }, [quota]);'''
          text = replace_once(text, old_percent, new_percent, "safe counter percent")

          text = text.replace(
              'Quota, tài khoản gửi, soạn thư, kiểm tra relay và lịch sử gửi trong một nơi.',
              'Gmail API OAuth, ngưỡng gửi an toàn, soạn thư và lịch sử gửi trong một nơi.',
              1,
          )

          header_buttons = '''            <div className="flex flex-wrap gap-2">
              <button type="button" onClick={refreshAll} disabled={quotaLoading || historyLoading} className="btn h-11 rounded-2xl border border-violet-200 bg-violet-50 text-violet-800 hover:bg-violet-100 font-black px-4">'''
          header_buttons_new = '''            <div className="flex flex-wrap gap-2">
              {quota && !quota.connected && (
                <button type="button" onClick={connectGmail} disabled={connectingGmail} className="btn h-11 rounded-2xl border border-emerald-200 bg-emerald-50 text-emerald-800 hover:bg-emerald-100 font-black px-4">
                  <Mail size={16} /> {connectingGmail ? "Đang mở Google…" : "Kết nối Gmail"}
                </button>
              )}
              <button type="button" onClick={refreshAll} disabled={quotaLoading || historyLoading} className="btn h-11 rounded-2xl border border-violet-200 bg-violet-50 text-violet-800 hover:bg-violet-100 font-black px-4">'''
          text = replace_once(text, header_buttons, header_buttons_new, "connect button")

          old_cards = '''            <div className="mt-3 text-base font-black text-slate-900 break-all">{quota?.senderEmail || "Chưa đọc được"}</div>
            <div className="mt-1 text-xs text-slate-500">Tài khoản chạy Google Apps Script</div>'''
          new_cards = '''            <div className="mt-3 text-base font-black text-slate-900 break-all">{quota?.senderEmail || (quota?.connected ? "Đã kết nối" : "Chưa kết nối")}</div>
            <div className="mt-1 text-xs text-slate-500">Tài khoản được ủy quyền qua Gmail API OAuth 2.0</div>'''
          text = replace_once(text, old_cards, new_cards, "sender card")

          old_quota = '''              <div className="text-xs font-black uppercase tracking-wider text-blue-700">Quota hiện tại</div>
              <Server size={18} className="text-blue-600" />
            </div>
            <div className="mt-3 text-2xl font-black text-slate-900">
              {quotaLoading ? "…" : Number.isFinite(Number(quota?.remaining)) ? Number(quota.remaining) : "—"}
              {Number.isFinite(Number(quota?.dailyLimit)) && <span className="text-sm text-slate-400"> / {quota.dailyLimit}</span>}
            </div>
            <div className="mt-3 h-2 rounded-full bg-slate-100 overflow-hidden">
              <div className="h-full rounded-full bg-gradient-to-r from-blue-500 to-violet-500 transition-all" style={{ width: `${quotaPercent ?? 0}%` }} />
            </div>
            <div className="mt-2 text-xs text-slate-500">Số người nhận còn lại trong quota hiện tại.</div>'''
          new_quota = '''              <div className="text-xs font-black uppercase tracking-wider text-blue-700">Ngưỡng gửi an toàn</div>
              <Server size={18} className="text-blue-600" />
            </div>
            <div className="mt-3 text-2xl font-black text-slate-900">
              {quotaLoading ? "…" : Number.isFinite(Number(quota?.sentToday)) ? Number(quota.sentToday) : "—"}
              {Number.isFinite(Number(quota?.dailyLimit)) && <span className="text-sm text-slate-400"> / {quota.dailyLimit}</span>}
            </div>
            <div className="mt-3 h-2 rounded-full bg-slate-100 overflow-hidden">
              <div className="h-full rounded-full bg-gradient-to-r from-blue-500 to-violet-500 transition-all" style={{ width: `${quotaPercent ?? 0}%` }} />
            </div>
            <div className="mt-2 text-xs text-slate-500">Đã gửi hôm nay • còn {Number.isFinite(Number(quota?.remaining)) ? quota.remaining : "—"} theo ngưỡng nội bộ.</div>'''
          text = replace_once(text, old_quota, new_quota, "quota card")

          old_relay = '''              {quota ? <CheckCircle2 size={18} className="text-emerald-600" /> : <AlertTriangle size={18} className="text-amber-500" />}
              {quota ? "Google Apps Script hoạt động" : "Chưa xác nhận"}
            </div>
            <div className="mt-1 text-xs text-slate-500">Provider: {quota?.provider || "gmail-apps-script"}</div>'''
          new_relay = '''              {quota?.connected ? <CheckCircle2 size={18} className="text-emerald-600" /> : <AlertTriangle size={18} className="text-amber-500" />}
              {quota?.connected ? "Gmail API đã kết nối" : "Chưa kết nối Gmail"}
            </div>
            <div className="mt-1 text-xs text-slate-500">Provider: {quota?.provider || "gmail-api"}</div>'''
          text = replace_once(text, old_relay, new_relay, "relay card")

          text = text.replace(
              '<div className="mt-1 text-xs text-slate-500">Scope: tài khoản Gmail gửi thư</div>',
              '<div className="mt-1 text-xs text-slate-500">Scope: gmail.send • token lưu mã hóa ở server</div>',
              1,
          )
          text = text.replace(
              '<div><strong>Không đọc được quota:</strong> {quotaError}</div>',
              '<div><strong>Không đọc được trạng thái Gmail:</strong> {quotaError}</div>',
              1,
          )

          quota_error_block = '''        {quotaError && (
          <div className="rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900 flex items-start gap-2">
            <AlertTriangle size={18} className="mt-0.5 shrink-0" />
            <div><strong>Không đọc được trạng thái Gmail:</strong> {quotaError}</div>
          </div>
        )}
'''
          connect_banner = quota_error_block + '''
        {quota && !quota.connected && !quotaError && (
          <div className="rounded-2xl border border-violet-200 bg-violet-50 px-4 py-4 text-sm text-violet-950 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
              <strong>Chưa kết nối Gmail API.</strong> Kết nối một lần để Duchi Locket gửi thư trực tiếp bằng OAuth 2.0, không dùng Apps Script.
            </div>
            <button type="button" onClick={connectGmail} disabled={connectingGmail} className="btn btn-sm rounded-xl border-0 bg-violet-600 text-white hover:bg-violet-700 font-black shrink-0">
              <Mail size={15} /> {connectingGmail ? "Đang mở Google…" : "Kết nối Gmail"}
            </button>
          </div>
        )}
'''
          text = replace_once(text, quota_error_block, connect_banner, "connect banner")

          text = text.replace(
              'disabled={testing} className="btn btn-sm',
              'disabled={testing || !quota?.connected} className="btn btn-sm',
              1,
          )
          text = text.replace(
              'disabled={sending || !targetEmail.trim()} className="btn mt-4',
              'disabled={sending || !targetEmail.trim() || !quota?.connected} className="btn mt-4',
              1,
          )
          text = text.replace("Gmail relay từ chối gửi thư.", "Gmail API từ chối gửi thư.")
          path.write_text(text)

          # --------------------------------------------------------------
          # Env example: Apps Script is legacy; document optional safe limit.
          # --------------------------------------------------------------
          env_path = Path("api/.env.example")
          if env_path.exists():
              env_text = env_path.read_text()
              if "GMAIL_SAFE_DAILY_LIMIT" not in env_text:
                  env_text += "\n# Gmail API safe counter (optional; defaults to 450)\nGMAIL_SAFE_DAILY_LIMIT=450\n"
              env_path.write_text(env_text)
          PY

      - name: Verify backend syntax
        run: |
          node --check api/src/services/gmailApiMailer.js
          node --check api/src/services/adminApologyMailer.js
          node --check api/src/routes/adminPinRecoveryRoutes.js
          node --check api/src/modules/slotMonitor/notifiers.js
          node --check api/src/routes/adminMailQuotaRoutes.js
          node --check api/src/routes/gmailOAuthCallbackRoutes.js
          node --check api/src/routes/index.js

      - name: Commit migration result
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/services/adminApologyMailer.js api/src/routes/adminPinRecoveryRoutes.js api/src/modules/slotMonitor/notifiers.js src/pages/Public/AdminEmailCenter.jsx api/.env.example
          git commit -m "feat(mail): migrate senders from Apps Script to Gmail API"
          git push origin main
