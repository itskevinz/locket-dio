name: Run seven admin upgrades integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-seven-admin-upgrades.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate
        run: python3 scripts/integrate-seven-admin-upgrades.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/routes/adminRoutes.js src/pages/Public/AdminUsers/index.jsx src/pages/LocketCameraBeta/BottomHomeScreen/Views/SwiperView/MomentViewer.jsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(admin): integrate seven operations upgrades"
          git push origin main
